specVersion: v0.1.0
package:
  name: evm_transfers
  version: v0.8.0
  url: https://github.com/pinax-network/substreams-evm-transfers
  description: |
    ERC-20, native transfers and ERC-20 token events into the Token API's
    evm-transfers ClickHouse tables. Ported from substreams-evm evm-transfers
    v0.3.3.

imports:
  # The three maps of v0.3.3, as local manifests.
  erc20_transfers: ../erc20/transfers/substreams.yaml
  erc20_tokens: ../erc20/tokens/substreams.yaml
  native_transfers: ../native/transfers/substreams.yaml

# DatabaseChanges as substreams-database-change 5.0.0 encodes it (value,
# update_op), from the crate's own source. The CLI adds the SQL sink's Service
# from its built-in sf/substreams/sink/sql/v1/deprecated.proto, and refuses
# that path here.
protobuf:
  files:
    - sf/substreams/sink/database/v1/database.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/evm_transfers.wasm

modules:
  - name: db_out
    kind: map
    inputs:
      - params: string
      - source: sf.substreams.v1.Clock
      - map: erc20_transfers:map_events
      - map: erc20_tokens:map_events
      - map: native_transfers:map_events
    output:
      type: proto:sf.substreams.sink.database.v1.DatabaseChanges

sink:
  module: db_out
  type: sf.substreams.sink.sql.v1.Service
  config:
    schema: "./clickhouse/schema.sql" # generated by `make schema`
    engine: clickhouse
    postgraphile_frontend:
      enabled: false

network: mainnet

params:
  db_out: "hex" # Supported encodings: hex, tron_base58
